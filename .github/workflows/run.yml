name: 刷步数

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "一次性测试步数；留空使用 CONFIG 的日常设置"
        required: false
        default: ""
        type: string

concurrency:
  group: mimotion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          MIMOTION_TEST_STEPS: ${{ inputs.steps }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py
      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if ! git diff --cached --quiet; then
            git commit -m "persist login tokens"
            git push origin master
          fi
